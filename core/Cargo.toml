[package]
name = "rusidian-core"
version = "0.3.0"
description = "UI-independent core of Rusidian: vault access, indexing, tasks, finance"
license = "MIT"
edition = "2024"

[dependencies]
calamine = "0.38"
encoding_rs = "0.8.44"
memchr = "2.8.3"
msoffice-crypto = { version = "=0.1.0-rc.15", features = ["crypto-ops"] }
notify-debouncer-mini = "0.7.0"
pdf-extract = "0.12"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
yaml-rust2 = "0.13.0"

[dev-dependencies]
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
